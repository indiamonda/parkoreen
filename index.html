<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Parkoreen - Choose a Level">
    <title>Parkoreen - Levels</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d5a27">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/png/icons/icon-play-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/png/icons/icon-play-64.png">
    <link rel="apple-touch-icon" href="assets/png/icons/icon-play-128.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* Levels Page */
        .levels-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .levels-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-lg) var(--spacing-xl);
            position: relative;
        }

        .levels-header-left,
        .levels-header-right {
            width: 80px;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .levels-title {
            font-family: 'Tektur', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .levels-nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .levels-nav-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .levels-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .levels-nav-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Levels Content */
        .levels-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
            overflow: hidden;
        }

        .levels-groups-container {
            display: flex;
            gap: 60px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .level-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .level-group.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .level-card {
            width: 180px;
            height: 180px;
            background: var(--surface);
            border-radius: var(--border-radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 3px solid transparent;
            overflow: hidden;
        }

        .level-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .level-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            border-color: var(--primary);
        }

        .level-card.completed {
            border-color: var(--primary);
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-card.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: transparent;
        }

        .level-card.completed::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-card-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .level-card-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .level-card-status {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .level-card-download {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            cursor: pointer;
            z-index: 10;
        }

        .level-card:hover .level-card-download {
            opacity: 1;
        }

        .level-card-download:hover {
            background: var(--primary);
        }

        .level-card-download svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* Loading Screen */
        .levels-loading {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .levels-loading.active {
            opacity: 1;
            pointer-events: all;
        }

        .levels-loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--surface-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        .levels-loading-text {
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Group Indicator */
        .group-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }

        .group-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--surface-light);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .group-dot:hover {
            background: var(--text-muted);
        }

        .group-dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }

        /* Menu Button */
        .menu-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--surface);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
            position: relative;
        }

        .menu-btn:hover {
            background: var(--primary);
        }

        .menu-btn-inner {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 20px;
        }

        .menu-btn-inner span {
            display: block;
            height: 3px;
            background: currentColor;
            border-radius: 2px;
        }

        /* Menu Dropdown */
        .menu-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 180px;
            background: rgba(15, 15, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-lg);
            padding: 6px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.95);
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
            z-index: 1000;
        }

        .menu-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: var(--border-radius);
            background: transparent;
            color: rgba(255, 255, 255, 0.88);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s ease;
            text-decoration: none;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item .material-symbols-outlined {
            font-size: 20px;
            opacity: 0.8;
        }

        /* Map Editor Button */
        .map-editor-btn {
            padding: 8px 16px;
            background: var(--surface);
            border: none;
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .map-editor-btn:hover {
            background: var(--primary);
        }

        .map-editor-btn.hidden {
            display: none;
        }

        /* Level Group Label */
        .level-group-label {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="levels-page">
        <header class="levels-header">
            <div class="levels-header-left">
                <button class="map-editor-btn hidden" id="btn-map-editor">
                    <span class="material-symbols-outlined">construction</span>
                    Map Editor
                </button>
            </div>
            <h1 class="levels-title">Parkoreen</h1>
            <div class="levels-header-right">
                <button class="menu-btn" id="btn-menu">
                    <span class="menu-btn-inner">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>
                <div class="menu-dropdown" id="menu-dropdown">
                    <a href="dashboard/" class="menu-item">
                        <span class="material-symbols-outlined">home</span>
                        Home
                    </a>
                    <a href="wiki/" target="_blank" class="menu-item">
                        <span class="material-symbols-outlined">menu_book</span>
                        Wiki
                    </a>
                    <a href="wiki/changelog/" target="_blank" class="menu-item">
                        <span class="material-symbols-outlined">history</span>
                        Changelog
                    </a>
                </div>
            </div>
        </header>

        <main class="levels-content">
            <button class="levels-nav-btn" id="btn-prev" disabled>
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>

            <div class="levels-groups-container" id="levels-container">
                <!-- Level groups will be inserted here -->
            </div>

            <button class="levels-nav-btn" id="btn-next">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
            </button>
        </main>

        <div class="group-indicator" id="group-indicator">
            <!-- Dots will be inserted here -->
        </div>
    </div>

    <!-- Loading Screen -->
    <div class="levels-loading" id="levels-loading">
        <div class="levels-loading-spinner"></div>
        <div class="levels-loading-text" id="loading-text">Loading...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="runtime.js?v=19"></script>
    <script src="assets/js/exportImport.js?v=12"></script>
    <script>
        // Level Groups Data
        const LEVEL_GROUPS = [
            { id: 0, name: 'Group 1', levels: ['0_1', '0_2', '0_3'] },
            { id: 1, name: 'Group 2', levels: ['1_1', '1_2', '1_3', '1_x_challenge_level'] },
            { id: 2, name: 'Group 3', levels: ['2_1', '2_2', '2_x_challenge_level'] },
            { id: 3, name: 'Group 4', levels: ['3_1', '3_2', '3_3', '3_4', '3_5'] }
        ];

        const LEVEL_BASE_PATH = 'assets/pkrn/levels/';

        // State
        let currentGroup = 0;
        let completedLevels = new Set();
        let group1Completed = false;

        // DOM Elements
        const container = document.getElementById('levels-container');
        const indicator = document.getElementById('group-indicator');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnMenu = document.getElementById('btn-menu');
        const menuDropdown = document.getElementById('menu-dropdown');
        const btnMapEditor = document.getElementById('btn-map-editor');
        const loadingScreen = document.getElementById('levels-loading');
        const loadingText = document.getElementById('loading-text');

        // Load progress from API (account) or localStorage (guest fallback)
        async function loadProgress() {
            // Check if user is logged in via runtime.js settings
            const isLoggedIn = window.Settings && window.Settings.user && window.Settings.user.id;

            if (isLoggedIn) {
                try {
                    const token = localStorage.getItem('parkoreen_token');
                    const response = await fetch(window.Settings.apiUrl + '/level-progress', {
                        headers: {
                            'Authorization': 'Bearer ' + token
                        }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        completedLevels = new Set(data.completed || []);
                        group1Completed = data.group1Completed || false;
                        return;
                    }
                } catch (e) {
                    console.error('Failed to load progress from API:', e);
                }
            }

            // Fallback to localStorage for guests or on error
            const saved = localStorage.getItem('parkoreen_level_progress');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    completedLevels = new Set(data.completed || []);
                    group1Completed = data.group1Completed || false;
                } catch (e) {
                    console.error('Failed to load progress:', e);
                }
            }
        }

        // Save progress to API (account) or localStorage (guest fallback)
        async function saveProgress() {
            const isLoggedIn = window.Settings && window.Settings.user && window.Settings.user.id;

            if (isLoggedIn) {
                try {
                    const token = localStorage.getItem('parkoreen_token');
                    const response = await fetch(window.Settings.apiUrl + '/level-progress', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({
                            completed: Array.from(completedLevels),
                            group1Completed: group1Completed
                        })
                    });
                    if (response.ok) {
                        return;
                    }
                } catch (e) {
                    console.error('Failed to save progress to API:', e);
                }
            }

            // Fallback to localStorage for guests or on error
            localStorage.setItem('parkoreen_level_progress', JSON.stringify({
                completed: Array.from(completedLevels),
                group1Completed: group1Completed
            }));
        }

        // Show loading screen
        function showLoading(text = 'Loading...') {
            loadingText.textContent = text;
            loadingScreen.classList.add('active');
        }

        // Hide loading screen
        function hideLoading() {
            loadingScreen.classList.remove('active');
        }

        // Get highest unlocked level (first uncompleted after completed)
        // Challenge levels unlock when all non-challenge levels in the group are completed
        function isUnlocked(groupIndex, levelIndex) {
            const levelName = LEVEL_GROUPS[groupIndex].levels[levelIndex];
            if (completedLevels.has(levelName)) return false; // already completed

            // Check if this is a challenge level (contains 'challenge' case-insensitive)
            const isChallenge = levelName.toLowerCase().includes('challenge');

            if (isChallenge) {
                // Challenge unlocks when ALL non-challenge levels in this group are completed
                const nonChallengeLevels = LEVEL_GROUPS[groupIndex].levels.filter(l => !l.toLowerCase().includes('challenge'));
                return nonChallengeLevels.every(l => completedLevels.has(l));
            } else {
                // Regular level unlocks when previous level in sequence is completed
                if (levelIndex === 0) {
                    // First level in group - check if previous group's challenge is completed
                    if (groupIndex === 0) return true; // first group, first level always unlocked
                    // Check if previous group's challenge is completed
                    const prevGroup = LEVEL_GROUPS[groupIndex - 1];
                    const prevChallenge = prevGroup.levels.find(l => l.toLowerCase().includes('challenge'));
                    if (prevChallenge) {
                        return completedLevels.has(prevChallenge);
                    }
                    return true;
                }

                const prevLevelName = LEVEL_GROUPS[groupIndex].levels[levelIndex - 1];
                const prevIsChallenge = prevLevelName.toLowerCase().includes('challenge');

                if (prevIsChallenge) {
                    // Previous is challenge - need challenge completed
                    return completedLevels.has(prevLevelName);
                } else {
                    // Previous is regular level - just need it completed
                    return completedLevels.has(prevLevelName);
                }
            }
        }

        function getHighestUnlockedLevel() {
            for (let g = 0; g < LEVEL_GROUPS.length; g++) {
                for (let l = 0; l < LEVEL_GROUPS[g].levels.length; l++) {
                    if (isUnlocked(g, l)) {
                        return { group: g, level: l, levelId: LEVEL_GROUPS[g].levels[l] };
                    }
                }
            }
            // All completed - return last level
            const lastGroup = LEVEL_GROUPS[LEVEL_GROUPS.length - 1];
            const lastLevel = lastGroup.levels[lastGroup.levels.length - 1];
            return { group: LEVEL_GROUPS.length - 1, level: lastGroup.levels.length - 1, levelId: lastLevel };
        }

        // Play the appropriate level based on progress (direct entry)
        async function playBasedOnProgress() {
            showLoading('Loading...');

            const { group, level, levelId } = getHighestUnlockedLevel();

            try {
                const response = await fetch(LEVEL_BASE_PATH + levelId + '.pkrn');
                if (!response.ok) throw new Error('Level not found');

                const buffer = await response.arrayBuffer();
                const importManager = new ImportManager();
                const data = await importManager.importFromFile(new File([buffer], levelId + '.pkrn'));

                sessionStorage.setItem('parkoreen_current_level', JSON.stringify(data));
                sessionStorage.setItem('parkoreen_current_level_name', levelId);
                sessionStorage.setItem('parkoreen_enter_level_direct', 'true');

                hideLoading();
                window.location.href = 'host.html?mode=play&level=true';
            } catch (err) {
                hideLoading();
                console.error('Failed to load level:', err);
                alert('Failed to load level: ' + err.message);
            }
        }

        // Render level groups
        function renderLevelGroups() {
            container.innerHTML = '';

            LEVEL_GROUPS.forEach((group, groupIndex) => {
                const groupEl = document.createElement('div');
                groupEl.className = 'level-group';
                groupEl.dataset.group = groupIndex;

                group.levels.forEach((levelName, levelIndex) => {
                    const isCompleted = completedLevels.has(levelName);
                    const isLocked = !isCompleted && !isUnlocked(groupIndex, levelIndex);
                    const card = document.createElement('div');
                    card.className = 'level-card' + (isCompleted ? ' completed' : '') + (isLocked ? ' locked' : '');
                    card.dataset.level = levelName;
                    card.dataset.group = groupIndex;

                    const displayName = levelName.startsWith(group.id + '_')
                        ? 'Level ' + (levelIndex + 1)
                        : levelName.replace(/^[0-9]_/, '').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

                    const icon = isCompleted ? 'check_circle' : (isLocked ? 'lock' : 'play_circle');
                    const status = isCompleted ? 'Completed' : (isLocked ? 'Locked' : 'Play');

                    card.innerHTML = `
                        <span class="level-card-icon material-symbols-outlined">${icon}</span>
                        <span class="level-card-name">${displayName}</span>
                        <span class="level-card-status">${status}</span>
                        <div class="level-card-download" title="Download map">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        </div>
                    `;

                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.level-card-download')) {
                            downloadLevel(levelName);
                        } else if (!isLocked) {
                            playLevel(levelName);
                        }
                    });

                    groupEl.appendChild(card);
                });

                container.appendChild(groupEl);
            });

            // Render indicator dots
            indicator.innerHTML = '';
            LEVEL_GROUPS.forEach((group, index) => {
                const dot = document.createElement('div');
                dot.className = 'group-dot' + (index === 0 ? ' active' : '');
                dot.dataset.group = index;
                dot.addEventListener('click', () => goToGroup(index));
                indicator.appendChild(dot);
            });
        }

        // Update group visibility with animation
        function updateGroupVisibility() {
            const groups = container.querySelectorAll('.level-group');
            groups.forEach((group, index) => {
                if (index === currentGroup) {
                    group.classList.add('visible');
                } else {
                    group.classList.remove('visible');
                }
            });

            // Update indicator dots
            const dots = indicator.querySelectorAll('.group-dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentGroup);
            });

            // Update nav buttons
            btnPrev.disabled = currentGroup === 0;
            btnNext.disabled = currentGroup === LEVEL_GROUPS.length - 1;
        }

        // Go to specific group with animation
        function goToGroup(groupIndex) {
            if (groupIndex < 0 || groupIndex >= LEVEL_GROUPS.length) return;

            currentGroup = groupIndex;
            const groupWidth = container.querySelector('.level-group')?.offsetWidth || 180;
            const offset = -groupIndex * (groupWidth + 60);
            container.style.transform = `translateX(${offset}px)`;
            updateGroupVisibility();
        }

        // Navigate to previous group
        function prevGroup() {
            if (currentGroup > 0) {
                goToGroup(currentGroup - 1);
            }
        }

        // Navigate to next group
        function nextGroup() {
            if (currentGroup < LEVEL_GROUPS.length - 1) {
                goToGroup(currentGroup + 1);
            }
        }

        // Play a level
        async function playLevel(levelName) {
            showLoading('Loading ' + levelName + '...');

            try {
                // Load the level file
                const response = await fetch(LEVEL_BASE_PATH + levelName + '.pkrn');
                if (!response.ok) {
                    throw new Error('Level not found');
                }

                const buffer = await response.arrayBuffer();
                const importManager = new ImportManager();
                const data = await importManager.importFromFile(new File([buffer], levelName + '.pkrn'));

                // Store level data in sessionStorage for host.html to load
                sessionStorage.setItem('parkoreen_current_level', JSON.stringify(data));
                sessionStorage.setItem('parkoreen_current_level_name', levelName);
                sessionStorage.removeItem('parkoreen_enter_level_direct');

                // Navigate to host.html in play mode
                hideLoading();
                window.location.href = 'host.html?mode=play&level=true';
            } catch (err) {
                hideLoading();
                console.error('Failed to load level:', err);
                alert('Failed to load level: ' + err.message);
            }
        }

        // Download level as .pkrn file
        async function downloadLevel(levelName) {
            try {
                const response = await fetch(LEVEL_BASE_PATH + levelName + '.pkrn');
                if (!response.ok) {
                    throw new Error('Level not found');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = levelName + '.pkrn';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('Failed to download level:', err);
                alert('Failed to download level');
            }
        }

        // Mark level as completed
        async function completeLevel(levelName) {
            completedLevels.add(levelName);

            // Check if group 1 (group 0) is completed
            const group0Levels = LEVEL_GROUPS[0].levels;
            const allGroup0Completed = group0Levels.every(l => completedLevels.has(l));
            if (allGroup0Completed && !group1Completed) {
                group1Completed = true;
            }

            await saveProgress();
            renderLevelGroups();
            updateGroupVisibility();
        }

        // Check if group 1 is completed and show map editor button
        function checkGroup1Completed() {
            if (group1Completed) {
                btnMapEditor.classList.remove('hidden');
            }
        }

        // Toggle menu
        function toggleMenu() {
            menuDropdown.classList.toggle('active');
        }

        // Close menu when clicking outside
        function handleClickOutside(e) {
            if (!btnMenu.contains(e.target) && !menuDropdown.contains(e.target)) {
                menuDropdown.classList.remove('active');
            }
        }

        // Initialize
        function init() {
            loadProgress();
            renderLevelGroups();
            updateGroupVisibility();
            checkGroup1Completed();

            // Event listeners
            btnPrev.addEventListener('click', prevGroup);
            btnNext.addEventListener('click', nextGroup);
            btnMenu.addEventListener('click', toggleMenu);
            btnMapEditor.addEventListener('click', () => {
                window.location.href = 'host.html';
            });
            document.addEventListener('click', handleClickOutside);

            // Check if coming back from completing 0_3 (special case)
            const specialReturn = sessionStorage.getItem('parkoreen_level_complete_special');
            if (specialReturn === 'true') {
                sessionStorage.removeItem('parkoreen_level_complete_special');
                completeLevel('0_3');
                goToGroup(2);
                return;
            }

            // If coming from host.html after completing levels, show the levels page normally
            // Only auto-enter if group 0 is NOT yet complete AND user came directly (no referrer)
            if (completedLevels.size === 0 && !document.referrer) {
                playBasedOnProgress();
                return;
            }
        }

        // Listen for level completion messages from host.html
        window.addEventListener('message', async (e) => {
            if (e.data.type === 'levelComplete') {
                const levelName = e.data.levelName;
                await completeLevel(levelName);

                // Special handling for 0_3
                if (levelName === '0_3') {
                    // Will be handled on return to index.html via special flag
                }
            }
        });

        // Check if returning from a completed level
        init();
    </script>
</body>
</html>
